<style>
  .cart-layout{ display:grid; grid-template-columns: 1fr 340px; gap:32px; align-items:start; }

  @media (max-width:560px){ .cart-item{ grid-template-columns: 64px 1fr; } .cart-item-price{ grid-column: 1/-1; text-align:left; } }

</style>
