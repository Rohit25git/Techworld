<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — TechWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .pd-layout{ display:grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items:start; }
  @media (max-width:860px){ .pd-layout{ grid-template-columns:1fr; gap:28px; } }
  .pd-media{ position:relative; overflow:hidden; aspect-ratio:1/1; border-radius: var(--radius); background: radial-gradient(circle at 30% 20%, rgba(0,180,216,.16), transparent 55%), linear-gradient(135deg, var(--navy), var(--navy-soft)); display:flex; align-items:center; justify-content:center; }
  .pd-media svg{ width:38%; height:38%; color: var(--tech-blue-light); filter: drop-shadow(0 12px 26px rgba(0,0,0,.4)); position:relative; z-index:1; }
  .pd-media .product-photo{ z-index:2; }
  .pd-thumbs{ display:flex; gap:10px; margin-top:14px; }
  .pd-thumb{ width:64px; height:64px; border-radius:8px; background: var(--surface-alt); border: 2px solid var(--line); display:flex; align-items:center; justify-content:center; color: var(--navy); }
  .pd-thumb.active{ border-color: var(--tech-blue); }
  .pd-thumb svg{ width:26px; height:26px; }
  .pd-title{ font-size: clamp(1.5rem, 3vw, 2rem); }
  .pd-price-row{ display:flex; align-items:baseline; gap:12px; margin: 14px 0; }
  .pd-price{ font-family: var(--font-mono); font-size:1.8rem; font-weight:700; color:var(--navy); }
  .pd-price-old{ font-family: var(--font-mono); color: var(--ink-soft); text-decoration:line-through; font-size:1.1rem; }
  .pd-save{ font-family: var(--font-mono); font-size:.78rem; color: var(--success); background:rgba(23,166,115,.12); padding:3px 8px; border-radius:4px; }
  .pd-actions{ display:flex; gap:12px; margin-top: 20px; flex-wrap:wrap; }
  .pd-trust{ display:flex; gap:22px; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .pd-trust div{ display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--ink-soft); }
  .pd-trust svg{ width:18px; height:18px; color: var(--tech-blue); }
  .spec-table{ width:100%; border-collapse: collapse; }
  .spec-table tr{ border-bottom:1px solid var(--line); }
  .spec-table td{ padding: 12px 6px; font-size:.9rem; }
  .spec-table td:first-child{ font-family: var(--font-mono); text-transform:uppercase; font-size:.72rem; letter-spacing:.05em; color: var(--ink-soft); width:180px; }
  .review-card{ padding:18px 0; border-bottom:1px solid var(--line); }
  .review-card .stars{ color: var(--amber); }
  .review-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .review-avatar{ width:34px; height:34px; border-radius:50%; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:.85rem; }
  .rating-summary{ display:flex; gap:28px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .rating-big{ font-family: var(--font-mono); font-size:2.6rem; font-weight:700; color:var(--navy); line-height:1; }
</style>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
  <nav class="breadcrumb" id="crumb"></nav>
</div>

<section class="container" id="pdRoot" style="padding-bottom:30px;"></section>

<section class="container" style="padding-bottom:50px;">
  <div class="tabs" id="pdTabs">
    <button class="tab-btn active" data-tab="desc">Description</button>
    <button class="tab-btn" data-tab="specs">Specifications</button>
    <button class="tab-btn" data-tab="reviews">Reviews</button>
  </div>
  <div class="tab-panel active" id="tab-desc"></div>
  <div class="tab-panel" id="tab-specs"><table class="spec-table" id="specTable"></table></div>
  <div class="tab-panel" id="tab-reviews">
    <div class="rating-summary" id="ratingSummary"></div>
    <div id="reviewList"></div>
  </div>
</section>

<section class="section alt">
  <div class="container">
    <div class="section-head"><div><div class="eyebrow">You might also like</div><h2>Related products</h2></div></div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
<script src="product-detail-page.js"></script>
</body>
</html>
